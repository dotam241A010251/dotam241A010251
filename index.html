<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập TK7: Tạo chuỗi ngẫu nhiên</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }
        h2 {
            color: #333;
            font-size: 1.2rem;
        }
        p {
            color: #666;
            font-size: 0.9rem;
        }
        .result-box {
            margin-top: 20px;
            padding: 12px;
            font-size: 1.2rem;
            letter-spacing: 2px;
            background: #eef2f7;
            border: 1px dashed #ccc;
            border-radius: 4px;
            color: #333;
            font-weight: bold;
        }
        button {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Bài tập TK7: Tạo chuỗi ngẫu nhiên</h2>
        <p>Tạo mật khẩu ngẫu nhiên dài 8 ký tự (chữ thường và số)[cite: 1].</p>
        
        <button onclick="hienThiMatKhau()">Tạo mật khẩu</button>
        
        <div class="result-box" id="passwordDisplay">--------</div>
    </div>

    <script>
        function taoMatKhauNgauNhien() {
            const kyTu = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let matKhau = '';
            
            for (let i = 0; i < 8; i++) {
                const viTriNgauNhien = Math.floor(Math.random() * kyTu.length);
                matKhau += kyTu[viTriNgauNhien];
            }
            
            return matKhau;
        }

        function hienThiMatKhau() {
            const matKhauMoi = taoMatKhauNgauNhien();
            document.getElementById('passwordDisplay').innerText = matKhauMoi;
        }
    </script>

</body>
</html>
